name: PR Checks
on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script found, skipping"
      # Root tsconfig.json is a solution file ("files": []), so `tsc --noEmit`
      # checked nothing; `tsc -b` checks the app and node projects.
      # continue-on-error is temporary: the existing type errors are fixed in a
      # follow-up PR, which removes this line so type errors block merges.
      - name: Type check
        run: npx tsc -b
        continue-on-error: true
      - name: Build
        run: npm run build
